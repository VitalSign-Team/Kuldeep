name: Sync VitalSign Team Repositories

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "VitalSign Sync Bot"
          git config user.email "actions@github.com"

      - name: Sync to Satya
        env:
          TOKEN: ${{ secrets.VITALSIGN_SYNC_TOKEN }}
        run: |
          git push "https://x-access-token:${TOKEN}@github.com/VitalSign-Team/Satya.git" HEAD:main --force

      - name: Sync to Rakshit
        env:
          TOKEN: ${{ secrets.VITALSIGN_SYNC_TOKEN }}
        run: |
          git push "https://x-access-token:${TOKEN}@github.com/VitalSign-Team/Rakshit.git" HEAD:main --force
